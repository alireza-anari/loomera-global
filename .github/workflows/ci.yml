  redis-phase7-7-rehearsal:
    name: Redis Phase 7.7 atomic OTP consume (synthetic isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LOOMERA_PHASE77_TEST_REDIS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned Redis and project import dependencies
        run: |
          # Loomera's package __init__ loads its Celery app on import.
          # No Django server, task worker, or real cache is started.
          python -m pip install --disable-pip-version-check \
            redis==5.2.1 django-redis==5.4.0 celery==5.4.0 Django==5.2.17

      - name: Verify Redis synthetic EVAL atomic consumption across worker processes
        run: |
          python -m unittest discover -s tests -p 'phase7_redis_atomic_test.py' -v

      - name: Phase 7.8 verify Django-Redis legacy serialized wire and race
        env:
          LOOMERA_PHASE78_TEST_REDIS: "1"
        run: |
          python -m unittest discover -s tests -p 'phase7_legacy_wire_test.py' -v

      - name: Phase 7.9 isolated Redis OTP version gate CAS and halt rehearsal
        env:
          LOOMERA_PHASE79_TEST_REDIS: "1"
        run: |
          python -m unittest discover -s tests -p 'phase7_versioned_gate_test.py' -v

      - name: Phase 7.10 synthetic v2 issue, consume, session claim and halt races
        env:
          LOOMERA_PHASE710_TEST_REDIS: "1"
        run: |
          python -m unittest discover -s tests -p 'phase7_v2_handoff_test.py' -v

      - name: Phase 7.11 Redis quarantine and ambiguous recovery race rehearsal
        env:
          LOOMERA_PHASE711_TEST_REDIS: "1"
        run: |
          python -m unittest discover -s tests -p 'phase7_otp_recovery_quarantine_test.py' -v

      - name: Phase 7.12 two-key Redis marker reattach and divergence rehearsal
        env:
          LOOMERA_PHASE712_TEST_REDIS: "1"
        run: |
          python -m unittest discover -s tests -p 'phase7_restart_marker_test.py' -v

      - name: Phase 7.13 real isolated Redis AOF graceful and SIGKILL process restart
        env:
          LOOMERA_PHASE713_TEST_REDIS: "1"
        run: |
          bash tests/phase7_redis_process_restart_ci.sh

      - name: Phase 7.14 two-node Redis replica promotion and old-primary read-only rejoin
        env:
          LOOMERA_PHASE714_TEST_REDIS: "1"
        run: |
          bash tests/phase7_redis_replica_promotion_ci.sh

      - name: Phase 7.15 real Redis dual-master partition with local synthetic witness halt
        env:
          LOOMERA_PHASE715_TEST_REDIS: "1"
          LOOMERA_PHASE715_WITNESS_TEST: "1"
        run: |
          bash tests/phase7_redis_network_partition_ci.sh

      - name: Phase 7.16 isolated Redis stale-token split-brain and witness epoch CAS drill
        env:
          LOOMERA_PHASE716_TEST_REDIS: "1"
          LOOMERA_PHASE716_TEST_WITNESS: "1"
        run: |
          bash tests/phase7_redis_epoch_fencing_ci.sh

      - name: Phase 7.17 five-node Redis synthetic majority and raw old-master bypass
        env:
          LOOMERA_PHASE717_TEST_REDIS: "1"
        run: |
          bash tests/phase7_redis_quorum_ci.sh

      - name: Phase 7.18 two-master Redis ACL split-brain raw EVAL rehearsal
        env:
          LOOMERA_PHASE718_TEST_REDIS: "1"
        run: |
          bash tests/phase7_redis_acl_partition_ci.sh

      - name: Phase 7.19 real Redis client ingress cut and host old-master bypass
        env:
          LOOMERA_PHASE719_TEST_REDIS: "1"
        run: |
          bash tests/phase7_redis_network_ingress_ci.sh

      - name: Phase 7.20 real Django-Redis STRING WATCH concurrent consume and ABA
        env:
          LOOMERA_PHASE720_TEST_REDIS: "1"
        run: |
          bash tests/phase7_redis_legacy_watch_ci.sh

      - name: Phase 7.21 real Redis legacy OTP correct wrong exhaustion and ABA CAS
        env:
          LOOMERA_PHASE721_TEST_REDIS: "1"
        run: |
          bash tests/phase7_redis_legacy_state_machine_ci.sh

      - name: Phase 7.22-7.24 real Django-Redis issue/consume, outage and operation-idempotency
        env:
          LOOMERA_PHASE722_TEST_REDIS: "1"
        run: |
          bash tests/phase7_redis_legacy_issue_rate_ci.sh

      - name: Phase 7.25 real Redis two-master lost ledger and host raw bypass
        env:
          LOOMERA_PHASE725_TEST_REDIS: "1"
        run: |
          bash tests/phase7_redis_idempotency_failover_ci.sh

  browser-smoke:
    name: Chromium keyboard smoke (booking and post-booking fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Chromium smoke dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          python -m pip install --disable-pip-version-check playwright==1.55.0 Django==5.2.17
          python -m playwright install --with-deps chromium

      - name: Verify production booking renderer and post-booking modal keyboard behavior
        run: |
          python tests/browser/phase3_booking_keyboard_chromium.py
          python tests/browser/phase3_post_booking_chromium.py
          python tests/browser/phase3_checkout_cta_chromium.py
          python tests/browser/phase3_booking_stage_handoff_chromium.py

      - name: Upload browser component evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-browser-keyboard-evidence
          path: artifacts/phase3-browser/
          if-no-files-found: ignore
          retention-days: 7

  postgis-phase5-rehearsal:
    name: PostGIS Phase 5.2 migration rehearsal (synthetic data)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: loomera_phase5
          POSTGRES_USER: loomera_ci
          POSTGRES_PASSWORD: loomera_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loomera_ci -d loomera_phase5"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key-not-for-runtime
      DATABASE_URL: postgis://loomera_ci:loomera_ci_only@127.0.0.1:5432/loomera_phase5
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
      ONLINE_PAYMENT_ENABLED: "False"
      MESSAGING_ENABLED: "False"
      MESSAGING_OUTBOUND_ENABLED: "False"
      BALE_BOT_ENABLED: "False"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install PostGIS Python/GDAL dependencies
