name: Loomera CI

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main

permissions:
  contents: read

concurrency:
  group: loomera-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SECRET_KEY: ci-only-secret-key-not-for-runtime
      DATABASE_URL: sqlite:///ci.sqlite3
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
      ONLINE_PAYMENT_ENABLED: "False"
      MESSAGING_ENABLED: "False"
      MESSAGING_OUTBOUND_ENABLED: "False"
      BALE_BOT_ENABLED: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system dependencies
        run: |
          # GitHub-hosted Ubuntu runners may prefer the Azure mirror, which can
          # stall large GDAL dependency downloads until the job times out.
          # Keep all packages and checks; use the public Ubuntu archive instead.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install --yes \
            gdal-bin \
            libgdal-dev \
            libgeos-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: |
          python manage.py check

      - name: Migration drift check
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Deployment configuration guards
        run: |
          python manage.py test \
            apps.main.test_liara_deployment_config \
            --failfast

      - name: Production settings hygiene
        run: |
          python manage.py test \
            apps.main.test_production_settings_hygiene \
            apps.main.test_build_release_archive \
            --failfast

      - name: Phase 2 buyer-brand smoke and email layout reference audit
        run: |
          python manage.py test \
            apps.main.test_phase2_buyer_brand_smoke \
            --failfast
