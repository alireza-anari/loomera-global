name: Loomera CI

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main

permissions:
  contents: read

concurrency:
  group: loomera-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SECRET_KEY: ci-only-secret-key-not-for-runtime
      DATABASE_URL: sqlite:///ci.sqlite3
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
      ONLINE_PAYMENT_ENABLED: "False"
      MESSAGING_ENABLED: "False"
      MESSAGING_OUTBOUND_ENABLED: "False"
      BALE_BOT_ENABLED: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system dependencies
        run: |
          # GitHub-hosted Ubuntu runners may prefer the Azure mirror, which can
          # stall large GDAL dependency downloads until the job times out.
          # Keep all packages and checks; use the public Ubuntu archive instead.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install --yes \
            gdal-bin \
            libgdal-dev \
            libgeos-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: |
          python manage.py check

      - name: Migration drift check
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Deployment configuration guards
        run: |
          python manage.py test \
            apps.main.test_liara_deployment_config \
            --failfast

      - name: Phase 3 language selection persistence and catalog guards
        run: |
          python manage.py test \
            apps.main.test_phase3_language_switch \
            --failfast

      - name: Phase 3 bidirectional shared shell regression guards
        run: |
          python manage.py test \
            apps.main.test_phase3_bidirectional_shell \
            --failfast

      - name: Phase 3 auth bidirectional presentation guards
        run: |
          python manage.py test \
            apps.main.test_phase3_bidirectional_auth \
            --failfast

      - name: Phase 3 gettext interactive message guards
        run: |
          python manage.py test \
            apps.main.test_phase3_interactive_messages \
            --failfast

      - name: Phase 3 browser interactive i18n runtime checks
        run: |
          node --check static/js/interactive_i18n.js
          node --check static/js/feedback.js
          node --input-type=module --check < static/js/pages/form_interactions.js
          node --test tests/js/phase3_interactive_i18n.test.cjs
          node --test tests/js/phase3_submit_pending.test.cjs

      - name: Phase 3 server and browser flash locale parity
        run: |
          python manage.py test \
            apps.main.test_phase3_flash_locale_parity \
            --failfast
          node --test tests/js/phase3_flash_ui_parity.test.cjs

      - name: Phase 3 server flash safe body locale policy
        run: |
          python manage.py test \
            apps.main.test_phase3_server_flash_safe_locale \
            --failfast

      - name: Phase 3 reviewed account and OTP flash translations
        run: |
          python manage.py test \
            apps.main.test_phase3_account_otp_flash_locale \
            --failfast

      - name: Phase 3 atomic compiled booking gettext parity
        run: |
          python manage.py test \
            apps.main.test_phase3_booking_gettext_migration \
            apps.main.test_phase3_booking_flash_locale \
            apps.main.test_phase3_rebooking_locale_flow \
            --failfast

      - name: Phase 3 compiled booking dynamic UI gettext and flash isolation
        run: |
          node --check static/js/interactive_i18n.js
          node --check static/js/select_stylist.js
          node --check static/js/select_datetime.js
          python manage.py test \
            apps.main.test_phase3_booking_dynamic_locale \
            --failfast
          node --test tests/js/phase3_booking_dynamic_locale.test.cjs

      - name: Phase 3 booking journey dynamic markup and locale guards
        run: |
          node --check static/js/select_stylist.js
          node --check static/js/select_datetime.js
          node --test tests/js/phase3_booking_journey_runtime.test.cjs
          python manage.py test \
            apps.main.test_phase3_booking_journey_security_a11y \
            apps.main.test_phase3_booking_bidirectional_accessibility \
            apps.main.test_phase3_exit_evidence \
            --failfast

      - name: Phase 3 checkout settlement and reschedule gettext safety
        run: |
          python manage.py test \
            apps.main.test_phase3_checkout_flash_locale \
            --failfast

      - name: Phase 3 localized submission progress guards
        run: |
          python manage.py test \
            apps.main.test_phase3_submit_pending \
            --failfast

      - name: Phase 3 shared auth copy and login feedback gettext guards
        run: |
          python manage.py test \
            apps.main.test_phase3_auth_shared_copy \
            --failfast

      - name: Phase 3 signup OTP and recovery validation localization guards
        run: |
          python manage.py test \
            apps.main.test_phase3_auth_recovery_errors \
            --failfast

      - name: Phase 3 OTP pluralization and attempt budget invariants
        run: |
          python manage.py test \
            apps.main.test_phase3_otp_pluralization \
            --failfast

      - name: Phase 3 verification and password recovery page locale guards
        run: |
          python manage.py test \
            apps.main.test_phase3_recovery_verify_pages \
            --failfast

      - name: Phase 3 recovery and OTP presentation, safety and browser behavior guards
        run: |
          python manage.py test \
            apps.main.test_phase3_recovery_otp_presentation \
            --failfast
          node --test tests/js/phase3_recovery_otp_presentation.test.cjs

      - name: Phase 3 password change page and feedback locale guards
        run: |
          python manage.py test \
            apps.main.test_phase3_change_password_page \
            --failfast

      - name: Phase 3 password change LTR layout guards
        run: |
          python manage.py test \
            apps.main.test_phase3_change_password_direction \
            --failfast

      - name: Phase 3 active auth password interaction locale guards
        run: |
          python manage.py test \
            apps.main.test_phase3_auth_password_interactions \
            --failfast
          node --test tests/js/phase3_auth_password_interactions.test.cjs

      - name: Phase 3 active authentication field error accessibility guards
        run: |
          python manage.py test \
            apps.main.test_phase3_auth_field_error_a11y \
            --failfast

      - name: Phase 3 password change browser behavior checks
        run: |
          node --test tests/js/phase3_change_password.test.cjs

      - name: Production settings hygiene
        run: |
          python manage.py test \
            apps.main.test_production_settings_hygiene \
            apps.main.test_build_release_archive \
            --failfast

      - name: Phase 2 buyer-brand smoke and email layout reference audit
        run: |
          python manage.py test \
            apps.main.test_phase2_buyer_brand_smoke \
            --failfast
      - name: Phase 3 request locale and bidirectional shell guards
        run: |
          python manage.py test \
            apps.main.test_phase3_locale_shell \
            --failfast
