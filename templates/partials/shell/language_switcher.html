{% load i18n %}
{# A presentation-only POST: CSRF-protected and limited to enabled locales. #}
{% if deployment_locale.enabled_languages|length > 1 %}
<form method="post"
      action="{% url 'set_deployment_language' %}"
      class="inline-flex max-w-full items-center gap-1"
      aria-label="{% translate 'Language' %} / زبان"
      data-deployment-language-switcher>
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path|default:'/' }}">
  <label class="sr-only" for="lm-language-{{ language_switcher_variant|default:'global' }}">{% translate 'Language' %} / زبان</label>
  <select name="language"
          id="lm-language-{{ language_switcher_variant|default:'global' }}"
          class="max-w-24 rounded-lg border border-loomera-borderSoft bg-white px-2 py-2 text-xs text-loomera-textPrimary"
          dir="auto">
    {% for code in deployment_locale.enabled_languages %}
      <option value="{{ code }}"{% if code == deployment_locale.language_code %} selected{% endif %}>
        {% if code == 'fa' %}فارسی{% elif code == 'en' %}English{% elif code == 'ar' %}العربية{% else %}{{ code }}{% endif %}
      </option>
    {% endfor %}
  </select>
  <button type="submit"
          class="rounded-lg border border-loomera-borderSoft bg-white px-2 py-2 text-xs font-semibold text-loomera-textPrimary"
          aria-label="{% translate 'Apply language' %} / تأیید زبان"
          title="{% translate 'Apply language' %} / تأیید زبان">✓</button>
</form>
{% endif %}
